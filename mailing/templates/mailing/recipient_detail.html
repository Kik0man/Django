{% extends 'base.html' %}

{% block title %}{{ recipient.full_name }}{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header">
        <h2>{{ recipient.full_name }}</h2>
    </div>
    <div class="card-body">
        <p><strong>Email:</strong> {{ recipient.email }}</p>
        <p><strong>Комментарий:</strong> {{ recipient.comment|linebreaks }}</p>
        <p><strong>Владелец:</strong> {{ recipient.owner.email }}</p>
    </div>
    <div class="card-footer">
        <a href="{% url 'mailing:recipient_list' %}" class="btn btn-secondary">← Назад</a>
        <a href="{% url 'mailing:recipient_update' recipient.pk %}" class="btn btn-warning">Редактировать</a>
        <a href="{% url 'mailing:recipient_delete' recipient.pk %}" class="btn btn-danger">Удалить</a>
    </div>
</div>
{% endblock %}
